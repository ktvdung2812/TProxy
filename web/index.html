<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020503" />
    <link rel="manifest" href="/dashboard/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/dashboard/icon-192.png" />
    <link rel="apple-touch-icon" href="/dashboard/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>tproxy :: control center</title>
    <!-- Fonts: JetBrains Mono (UI) + Share Tech Mono (display) + Material Symbols Outlined (icons) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />
    <script>
      // Apply persisted theme before first paint to avoid flash of incorrect theme.
      (function () {
        try {
          var saved = localStorage.getItem("tproxy-theme");
          var useDark = saved ? saved === "dark" : true; // default to dark
          var root = document.documentElement;
          root.classList.toggle("dark", useDark);
          root.classList.toggle("light", !useDark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
        // Reveal icon ligatures once the icon font is ready (matches 9router globals.css).
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function () {
            document.documentElement.classList.add("fonts-loaded");
          });
        } else {
          document.documentElement.classList.add("fonts-loaded");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
