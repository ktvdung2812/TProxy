services:
  tproxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: tproxy:deploy
    container_name: tproxy
    restart: unless-stopped
    ports:
      - "28120:28120"
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:28120/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
