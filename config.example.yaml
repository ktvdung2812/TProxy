# Example configuration with sample providers and models.
# For a clean first install, run `tproxy` without ./config.yaml or copy
# internal/config/default.yaml — the database will start empty.
server:
  host: 127.0.0.1
  port: 28120
  allow-local-without-key: false
  allow-remote-management: false
  allow-upstream-models: false

database:
  driver: sqlite
  dsn: tproxy.db

security:
  # Generate this before adding a provider credential or proxy URL. Keeping the
  # variable unset is supported for an initial health-only bootstrap.
  master-key-env: TPROXY_MASTER_KEY
  management-secret-env: TPROXY_MANAGEMENT_SECRET
  plugins-enabled: false

routing:
  strategy: round-robin
  sticky-round-robin-limit: 3
  session-affinity: true
  session-affinity-ttl: 1h
  # Per-provider overrides (optional):
  # provider-strategies:
  #   codex-main:
  #     strategy: round-robin
  #     sticky-round-robin-limit: 5

  # Automatic provider failover for the Provider Priority Manager chain. After
  # failure-threshold consecutive failures against a provider (counted per model)
  # it is skipped and traffic moves to the next provider in the chain. It is
  # probed again after reset-timeout, with the wait doubling on repeat trips up
  # to max-reset-timeout.
  failover:
    enabled: true
    failure-threshold: 3
    reset-timeout: 5m
    max-reset-timeout: 30m
    # 429/401/403 are per-account problems handled by account cooldown and token
    # refresh, so they do not count against the provider by default.
    # count-account-errors: false
    # Per-provider overrides (optional):
    # providers:
    #   openrouter:
    #     failure-threshold: 2
    #     reset-timeout: 10m

  # Cooldown behaviour after a credential fails.
  cooldown:
    # Turn off every account/model cooldown. Use when one account is the only
    # credential and a blackout window is worse than retrying a failing upstream.
    disabled: false
    # Backoff for retryable upstream failures (408/500/502/503/504).
    # "off" disables it while auth (401/402/403) and quota (429) cooldowns stay.
    # An explicit status-5xx entry still wins over this shorthand.
    transient: ""

  # Bounds the work one client request may do before the caller sees an error.
  retry:
    # Extra tries against the SAME credential for a transient upstream failure
    # (403/408/500/502/503/504). 0 (default) keeps the legacy no-retry behaviour.
    attempts: 0
    # Cap on how many different credentials one request may walk through.
    # 0 (default) tries every candidate.
    max-credentials: 0
    # Wait this long for a credential whose cooldown is about to end instead of
    # skipping it. Empty (default) never waits.
    max-wait: ""
    # Pause between same-credential attempts. Default 500ms.
    backoff: 500ms

# Keep idle connections alive. Proxies and load balancers often drop a
# connection that sends nothing for 30-60s, which looks like a truncated stream.
streaming:
  # Emit an SSE comment when a stream has been silent this long. Empty disables.
  keepalive-interval: ""
  # Emit newlines while a non-streaming request waits on the upstream. JSON
  # ignores leading whitespace, so the response stays valid. Empty disables.
  nonstream-keepalive-interval: ""

retention:
  usage-events: 2160h
  audit-events: 2160h
  media-jobs: 720h
  oauth-sessions: 24h
  cleanup-interval: 1h

limits:
  requests-per-minute: 600
  concurrent-streams: 64
  max-input-bytes: 33554432
  max-output-tokens: 65536
  media-jobs: 32
  budget-usd-per-day: 0

teams:
  - id: engineering
    limits:
      requests-per-minute: 300
      concurrent-streams: 32

# Direct egress is implicit. Proxy pool URLs (including "direct") are encrypted
# in SQLite, so add pools only after TPROXY_MASTER_KEY has been configured.
proxy-pools: []

client-api-keys:
  - id: local
    name: Local development
    key-env: TPROXY_API_KEY
    policy:
      team: engineering
      limits:
        requests-per-minute: 120
        concurrent-streams: 16
        max-input-bytes: 16777216
        max-output-tokens: 32768
        media-jobs: 8
        budget-usd-per-day: 0

providers:
  - id: openai-main
    type: openai-compatible
    name: OpenAI-compatible primary
    base-url: https://api.openai.com
    enabled: true
    # OAuth providers can use the same adapter with browser PKCE or device flow.
    # oauth:
    #   authorization-url: https://provider.example/oauth/authorize
    #   token-url: https://provider.example/oauth/token
    #   device-code-url: https://provider.example/oauth/device/code
    #   client-id-env: TPROXY_PROVIDER_CLIENT_ID
    #   client-secret-env: TPROXY_PROVIDER_CLIENT_SECRET
    #   scopes: [profile, inference]
    #   redirect-url: http://127.0.0.1:28120/api/admin/oauth/callback
    #   refresh-safety-window: 2m
    #   # Token freshness. Independent of expires_at, so credentials whose token
    #   # never expires (or expires far in the future) still get rotated before the
    #   # provider drops an unused refresh token.
    #   #   max-token-age      background rotation kicks in at this age (default 48h)
    #   #   hard-max-token-age ceiling enforced before use (default 72h)
    #   max-token-age: 48h
    #   hard-max-token-age: 72h
    #   extra-auth-params: {}
    #   extra-token-params: {}
    credentials:
      - id: openai-primary
        label: Primary account
        auth-type: api_key
        secret-env: OPENAI_API_KEY
        priority: 100

  - id: ollama-local
    type: ollama
    name: Local Ollama
    base-url: http://127.0.0.1:11434
    enabled: false
    credentials:
      - id: ollama-no-auth
        label: Local runtime
        auth-type: none
        priority: 10

  # Provider-specific OAuth profiles use secure defaults for browser PKCE,
  # token request format and first-party headers.
  # On a remote server, prefer device mode when supported. Browser profiles use
  # registered loopback callback ports, so complete them through an SSH tunnel
  # or a browser on the server instead of exposing management endpoints.
  # - id: codex-subscription
  #   type: codex
  #   enabled: true
  #   credentials:
  #     - id: codex-account
  #       label: Codex subscription
  #       auth-type: oauth
  #       priority: 100
  # - id: claude-subscription
  #   type: claude
  #   enabled: true
  #   config:
  #     # Claude Code OAuth tokens are scoped to Claude Code. Requests that do
  #     # not look like Claude Code traffic are billed against the account's
  #     # extra usage instead of its plan, so by default tproxy presents the
  #     # Claude Code client fingerprint (headers, billing block, tool names)
  #     # on this provider's OAuth credentials. API keys are never altered, and
  #     # a caller that is itself Claude Code is forwarded untouched.
  #     # Set to "off" to forward every request exactly as received.
  #     claude_cloaking: "on"
  #     # Prepend "You are Claude Code, Anthropic's official CLI for Claude."
  #     # to the system prompt. Off by default: unlike the headers above, this
  #     # line is visible to the model and changes how it answers. The caller's
  #     # own system prompt is kept either way.
  #     claude_agent_prompt: "off"
  #     # Dial Anthropic with the Claude Code TLS handshake instead of Go's, so
  #     # the transport agrees with the headers above. On by default: without
  #     # it the handshake contradicts those headers and the account is billed
  #     # as a third-party app. The connection is pinned to HTTP/1.1, since the
  #     # imitated client offers no h2. OAuth credentials only; API keys are
  #     # always dialled normally, and an https:// proxy cannot carry it and
  #     # falls back to an ordinary connection.
  #     # Set to "off" to dial normally.
  #     claude_tls_fingerprint: "on"
  #   credentials:
  #     - id: claude-account
  #       label: Claude subscription
  #       auth-type: oauth
  #       priority: 100
  # - id: kimi-code
  #   type: kimi
  #   enabled: true
  #   credentials:
  #     - id: kimi-account
  #       label: Kimi Code account
  #       auth-type: oauth
  #       priority: 100
  # - id: antigravity
  #   type: antigravity
  #   enabled: true
  #   # Set TPROXY_ANTIGRAVITY_CLIENT_SECRET before starting browser OAuth.
  #   credentials:
  #     - id: antigravity-account
  #       label: Google Antigravity account
  #       auth-type: oauth
  #       priority: 100
  # - id: tavily-search
  #   type: tavily
  #   enabled: true
  #   credentials:
  #     - id: tavily-primary
  #       label: Tavily API key
  #       auth-type: api_key
  #       secret-env: TAVILY_API_KEY
  #       priority: 100
  # - id: elevenlabs-audio
  #   type: elevenlabs
  #   enabled: true
  #   credentials:
  #     - id: elevenlabs-primary
  #       label: ElevenLabs API key
  #       auth-type: api_key
  #       secret-env: ELEVENLABS_API_KEY
  #       priority: 100

models:
  - id: td-coder-pro
    display-name: TD Coder Pro
    aliases: [coder, gpt-latest]
    enabled: true
    expose-upstream-name: false
    rewrite-response-model: true
    capabilities: [text, vision, tools, reasoning]
    routes:
      - id: coder-openai
        provider: openai-main
        upstream-model: gpt-5.4
        priority: 100
        weight: 1
        pricing:
          input-per-million: 2.5
          output-per-million: 10
          reasoning-per-million: 10
      - id: coder-ollama
        provider: ollama-local
        upstream-model: qwen3-coder
        priority: 10
        weight: 1
